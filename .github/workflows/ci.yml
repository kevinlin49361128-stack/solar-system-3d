name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Typecheck + tests + build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Bumped to 22 (current LTS) because rollup-plugin-visualizer
          # 7.x in devDependencies requires node >=22. Node 20 worked
          # functionally but flooded the install logs with
          # EBADENGINE warnings on every push.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npx vitest run --reporter=default

      - name: Production build
        run: npx vite build
